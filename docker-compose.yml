services:
  web:
    build: .
    expose: ["8000"]
    # Trusting every forwarded address is safe only because port 8000 is reachable solely from the compose network.
    command:
      [
        "uvicorn", "ferret.web.app:app", "--host", "0.0.0.0", "--port", "8000",
        "--proxy-headers", "--forwarded-allow-ips", "*",
      ]
    volumes:
      - ./data:/app/data
    environment:
      FERRET_DATA_DIR: /app/data
      FERRET_MASTER_KEY_FILE: /run/secrets/ferret_master_key
      FERRET_BASE_URL: https://${FERRET_DOMAIN:?set FERRET_DOMAIN in .env}
      FERRET_SMTP_HOST: ${FERRET_SMTP_HOST:-}
      FERRET_SMTP_PORT: ${FERRET_SMTP_PORT:-587}
      FERRET_SMTP_USERNAME: ${FERRET_SMTP_USERNAME:-}
      FERRET_SMTP_PASSWORD: ${FERRET_SMTP_PASSWORD:-}
      FERRET_SMTP_FROM: ${FERRET_SMTP_FROM:-}
      FERRET_SMTP_SECURITY: ${FERRET_SMTP_SECURITY:-starttls}
      FERRET_GOOGLE_CLIENT_ID: ${FERRET_GOOGLE_CLIENT_ID:-}
      FERRET_GOOGLE_CLIENT_SECRET: ${FERRET_GOOGLE_CLIENT_SECRET:-}
    secrets:
      - ferret_master_key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: ["python", "-m", "ferret.worker"]
    depends_on: [web]
    volumes:
      - ./data:/app/data
    environment:
      FERRET_DATA_DIR: /app/data
      FERRET_MASTER_KEY_FILE: /run/secrets/ferret_master_key
      FERRET_GOOGLE_CLIENT_ID: ${FERRET_GOOGLE_CLIENT_ID:-}
      FERRET_GOOGLE_CLIENT_SECRET: ${FERRET_GOOGLE_CLIENT_SECRET:-}
    secrets:
      - ferret_master_key
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FERRET_DOMAIN: ${FERRET_DOMAIN:?set FERRET_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  caddy_data: {}
  caddy_config: {}

secrets:
  ferret_master_key:
    file: ./secrets/ferret_master_key
