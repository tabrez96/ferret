<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Ferret{% endblock %}</title>
  <link rel="icon" href="/static/img/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/ferret.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/">
        <img src="/static/img/mark.svg" alt="" width="28" height="28">
        <span class="wordmark">ferret</span>
      </a>
      <nav class="nav" aria-label="Main">
        <ul>
          <li><a href="/" {% if active_nav == "spending" %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 4v16h16M8 16v-4M12 16V8M16 16v-6"/></svg>
            <span>Spending</span></a></li>
          <li><a href="/statements" {% if active_nav == "statements" %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>
            <span>Statements</span></a></li>
          <li><a href="/settings" {% if active_nav == "settings" %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
            <span>Settings</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-account">{% block account %}{% endblock %}</div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
