[project]
name = "ferret"
version = "0.1.0"
description = "Credit card spending visibility from your statements, with no manual entry"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.9.5",
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.10",
    "pikepdf>=10.18.0",
    "python-multipart>=0.0.33",
    "sqlcipher3-wheels>=0.5.7",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferret"]

[tool.ruff]
line-length = 100
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["ferret"]
branch = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.4",
]
