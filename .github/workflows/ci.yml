name: CI
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=ferret --cov-report=term-missing
  secret-scan:
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: "1.10.1"
      BETTERLEAKS_SHA256: "c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install betterleaks
        run: |
          curl -fsSLo /tmp/betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  /tmp/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/betterleaks.tar.gz -C /tmp betterleaks
          sudo install /tmp/betterleaks /usr/local/bin/betterleaks
          betterleaks version
      - name: Scan full git history
        run: betterleaks git --redact --verbose --exit-code 1 --config .betterleaks.toml --log-opts="--full-history --all --diff-filter=tuxdb --diff-merges=first-parent" .
